# Render Blueprint. The names "landed" and "landed-db" match the existing Render resources,
# so a sync updates the live site in place.
# Free plan: fine for demos. For real money switch the web service to Starter (it must not sleep,
# or Paystack webhooks can time out) and the database to a paid plan (free ones expire).
services:
  - type: web
    name: landed
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: landed-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: staging          # production once PAYMENT_PROVIDER=paystack with a live key
      - key: PAYMENT_PROVIDER
        value: mock             # test mode until Landed's Paystack account is approved
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_DVA_BANK
        value: test-bank        # wema-bank or titan-paystack with a live key
      - key: LANDED_FEE_PERCENT
        value: "1.0"
      - key: EMBED_SCHEDULER
        value: "true"
      - key: WHATSAPP_DRY_RUN
        value: "true"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: landed-db
    plan: free
    databaseName: landed
    user: landed
