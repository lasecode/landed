{% extends "registration/auth_base.html" %}{% block card %}
{% if validlink %}<form method="post" class="form">{% csrf_token %}<h1>Choose a new password</h1>
{% for f in form %}{% include "registration/_field.html" %}{% endfor %}<button class="btn primary block">Save password</button></form>
{% else %}<h1>Link expired</h1><p class="muted">Request a new reset link.</p><a class="link" href="{% url 'password_reset' %}">Reset password</a>{% endif %}
{% endblock %}
